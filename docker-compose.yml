services:
  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: wizardherald-dev
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - ./typesense-data:/data
    command: "--data-dir /data --api-key=wizardherald-dev --enable-cors --enable-search-analytics --analytics-dir /data/analytics --analytics-flush-interval=60"
